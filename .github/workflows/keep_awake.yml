name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake or Ping Streamlit App
        run: |
          npx --yes playwright@latest install chromium
          node -e '
            const { chromium } = require("playwright");
            (async () => {
              const browser = await chromium.launch();
              const page = await browser.newPage();
              await page.goto("https://rajasthanroyalsauctioncb.streamlit.app/", { waitUntil: "networkidle", timeout: 60000 });
              const wakeBtn = page.getByRole("button", { name: /get this app back up/i });
              if (await wakeBtn.isVisible().catch(() => false)) {
                console.log("App was asleep — waking it up...");
                await wakeBtn.click();
                await page.waitForTimeout(20000);
              } else {
                console.log("App is already awake.");
              }
              await browser.close();
            })();
          '
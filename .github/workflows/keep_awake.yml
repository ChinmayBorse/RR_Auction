name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Wake or Ping Streamlit App
        run: |
          python -c '
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto("https://rajasthanroyalsauctioncb.streamlit.app/", wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(5000)

              wake_btn = page.get_by_role("button", name="Yes, get this app back up!")
              if wake_btn.is_visible():
                  print("App was asleep — clicking wake button...")
                  wake_btn.click()
                  page.wait_for_timeout(20000)
              else:
                  print("App is already awake!")

              browser.close()
          '